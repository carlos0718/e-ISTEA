<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        .navbar-brand {
            color: #fff;
            font-size: xx-large;
            font-weight: 700;
        }

        .navbar-brand:hover {
            color: #ffbe0b !important;
        }

        .nav-link {
            color: white !important;
            font-size: large;
        }

        .active {
            color: #ffbe0b !important;
            font-weight: 500;
        }

        .form-control {
            border: 2px solid rgb(13 110 253);
        }
    </style>
</head>

<body>
    <header class="bg-primary" style="min-height: 100px;">
        <nav class="navbar navbar-expand-lg py-3">
            <div class="container">
                <a class="navbar-brand" href="#">FAKE SHOP</a>

                <!-- Botón del carrito para móviles -->
                <div class="d-flex align-items-center gap-2 d-lg-none">
                    <button class="btn btn-primary position-relative" type="button" data-bs-toggle="offcanvas"
                            data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                        <i class="bi bi-minecart" style="font-size: 1.5rem; color: #ffbe0b;"></i>
                        <!--  <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            <span class="visually-hidden">productos en carrito</span>
                        </span> -->
                    </button>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Features</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Pricing</a>
                        </li>
                    </ul>
                </div>

                <!-- Botón del carrito para desktop -->
                <div class="d-none d-lg-block">
                    <button class="btn btn-primary position-relative" type="button" data-bs-toggle="offcanvas"
                            data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                        <i class="bi bi-minecart" style="font-size: 1.5rem; color: #ffbe0b;"></i>
                        <!-- <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                            <span class="visually-hidden">productos en carrito</span>
                        </span> -->
                    </button>
                </div>
            </div>
        </nav>
    </header>
    <section class="d-flex justify-content-center align-items-center">
        <input type="text" name="txt-filter" id="filter" class="form-control w-50 mt-3 mb-3"
               placeholder="Buscar productos...">
    </section>
    <main class="container">
        <div class="container mt-5">
            <div class="row row-cols-1 row-cols-md-3 g-4" id="list-products">
                <!-- renderizar productos desde js -->
            </div>
        </div>
    </main>
    <!-- modal detalles del producto -->
    <div class="modal fade" id="exampleModalFullscreen" tabindex="-1" aria-labelledby="exampleModalFullscreenLabel"
         aria-hidden="true">
        <!-- modal generado desde js para cada producto -->
    </div>

    <!-- offcanvas carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel"
         style="width: 35rem;">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasRightLabel">Lista de Productos</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">

        </div>
    </div>
    <!-- notificaciones -->
    <section aria-live="polite" aria-atomic="true" class="position-relative z-index-100">
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <!-- Los toasts se agregarán aquí dinámicamente -->
        </div>
    </section>
    <!-- Footer -->
    <footer class="bg-primary text-lg-start mt-5 d-flex justify-content-center align-items-center"
            style="height: 150px;">
        <div class="p-3 fs-3 text-white">
            © 2025 Fake Shop - ISTEA
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>

    <script type="module" src="./src/index.js"></script>
</body>

</html>
