<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="./css/styles.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">FAKE SHOP</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#" id="home">Home</a>
                        </li>
                        <div id="navbar-categories" class="d-flex flex-column flex-lg-row">
                            <!-- generado desde js -->

                        </div>

                        <li class="nav-item">
                            <button type="button" class="btn btn-outline-dark border-0" data-bs-toggle="offcanvas"
                                    data-bs-target="#offcanvasRight" aria-controls="offcanvasRight"><i
                                   class="bi bi-cart-fill small"></i></button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mb-5 min-vh-100">
        <div id="hero-image" class="my-3">
            <img src="banner-website.png" alt="" class="img-fluid rounded w-100">
        </div>
        <div class="my-3">
            <input class="form-control" type="text" id="search-input" placeholder="Search">
        </div>
        <div class="row row-cols-lg-4 row-cols-md-3 row-cols-sm-2 g-4 justify-content-center" id="product-list">
            <!-- generado desde js -->
        </div>

        <!-- Modal -->
        <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        </div>
        <!-- Offcanvas sidebar carrito-->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasRightLabel">Mis Productos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <!-- generado desde js -->
            </div>
            <div class="offcanvas-footer d-flex justify-content-around p-3 border-top">
                <button type="button" class="btn btn-dark">Finalizar Compra</button>
                <button type="button" class="btn btn-close-white border-1 border-dark">Vaciar Carrito</button>
            </div>
        </div>
        <!-- Toast -->
        <div aria-live="polite" aria-atomic="true" class="position-fixed"
             style="z-index: 1055; top: 20px; right: 20px; width: 350px;">
            <div class="toast-container">
                <!-- generado desde js -->
            </div>
        </div>
    </main>
    <footer class="bg-dark text-light d-flex align-items-center justify-content-center" style="height: 10rem;">
        <p class="fs-4">&copy; 2025 My Website</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script type="module" src="./src/index.js"></script>
</body>

</html>
